# db_man — обратный прокси к серверу приложения.
# Сервер сам раздаёт SPA (сборку client/dist) и API (/api/*),
# поэтому достаточно проксировать весь трафик на server.host:server.port из config.json.
# Замените 127.0.0.1:3001, если меняли server.host / server.port.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # VACUUM / ANALYZE / REINDEX DATABASE могут выполняться дольше 60 секунд
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
